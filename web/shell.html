<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Burnout 3 in the browser</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0b0d; color: #d8d8dc; font: 13px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  canvas { width: 100%; height: 100%; display: block; background: #000; }
  #bar { display: flex; gap: 16px; align-items: center; padding: 6px 12px; background: #141418; border-top: 1px solid #222; }
  #status { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stats { font-variant-numeric: tabular-nums; color: #9ad; }
  select { background: #2a3a55; color: #fff; border: 0; padding: 5px 8px; border-radius: 4px; }
  button { background: #2a3a55; color: #fff; border: 0; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.6); padding: 16px; }
  #panel { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 520px; text-align: center; }
  #help { margin: 0; line-height: 1.5; color: #e8c37a; }
  .controls { display: none; }
  body.touch { overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
  body.touch #stage { flex: none; width: 100%; aspect-ratio: 4 / 3; max-height: 60vh; }
  body.touch .controls {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "mid mid" "left right";
    gap: 10px 8px; align-content: center; padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    touch-action: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    --ctl: #1d2433; --ctl-on: #4a6aa5; --ctl-line: #34405a; --ctl-text: #dfe6f3;
  }
  .cluster { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .cluster.left { grid-area: left; } .cluster.right { grid-area: right; }
  .cluster.mid { grid-area: mid; flex-direction: row; gap: 10px; justify-self: center; }
  .shoulders { display: flex; gap: 8px; width: 100%; max-width: 160px; }
  .ctl {
    display: flex; align-items: center; justify-content: center; color: var(--ctl-text);
    background: var(--ctl); border: 1px solid var(--ctl-line); font-weight: 600;
  }
  .ctl.on, .dpad span.on { background: var(--ctl-on); }
  .shoulder { flex: 1; height: 38px; border-radius: 12px 12px 6px 6px; }
  .small { padding: 0 12px; height: 30px; border-radius: 15px; font-size: 12px; font-weight: 500; }
  .face { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); }
  .face .ctl { border-radius: 50%; font-size: 20px; }
  .face .tri { grid-area: 1 / 2; } .face .sq { grid-area: 2 / 1; }
  .face .ci { grid-area: 2 / 3; } .face .cr { grid-area: 3 / 2; }
  .dpad { width: 120px; height: 120px; display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 40px); }
  .dpad span {
    display: flex; align-items: center; justify-content: center; font-size: 14px;
    color: var(--ctl-text); background: var(--ctl); border: 1px solid var(--ctl-line);
  }
  .dpad .up { grid-area: 1 / 2; border-radius: 8px 8px 0 0; } .dpad .down { grid-area: 3 / 2; border-radius: 0 0 8px 8px; }
  .dpad .left { grid-area: 2 / 1; border-radius: 8px 0 0 8px; } .dpad .right { grid-area: 2 / 3; border-radius: 0 8px 8px 0; }
  .dpad .hub { grid-area: 2 / 2; }
  .stick { position: relative; width: 120px; height: 120px; border-radius: 50%; background: var(--ctl); border: 1px solid var(--ctl-line); }
  .knob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: var(--ctl-on); border: 1px solid var(--ctl-line);
  }
  body.touch.hide-controls .controls { display: none; }
  #exit-fullscreen {
    display: none; position: fixed; z-index: 3; top: calc(8px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right));
    padding: 4px 10px; font-size: 12px; background: rgba(255, 255, 255, 0.15); opacity: 0.4;
  }
  #exit-fullscreen:hover { opacity: 0.9; }
  body.fullscreen { background: #000; }
  body.fullscreen #bar { display: none; }
  body.fullscreen #exit-fullscreen { display: block; }
  @media (orientation: landscape) {
    body.touch #stage { flex: 1; aspect-ratio: auto; max-height: none; }
    body.touch .controls { position: fixed; inset: 0; display: block; padding: 0; pointer-events: none; z-index: 1;
      --ctl: rgba(255, 255, 255, 0.12); --ctl-on: rgba(255, 255, 255, 0.45); --ctl-line: rgba(255, 255, 255, 0.28); --ctl-text: #fff; }
    body.touch .cluster { position: absolute; top: 8px; bottom: 40px; justify-content: space-between; pointer-events: auto; opacity: 0.75; }
    body.touch .cluster.left { left: calc(10px + env(safe-area-inset-left)); }
    body.touch .cluster.right { right: calc(10px + env(safe-area-inset-right)); }
    body.touch .cluster.mid { top: auto; bottom: 40px; left: 50%; transform: translateX(-50%); }
    body.touch .dpad { width: 105px; height: 105px; grid-template-columns: repeat(3, 35px); grid-template-rows: repeat(3, 35px); }
    body.touch .stick { width: 105px; height: 105px; }
    body.touch .face { grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); }
    body.fullscreen.touch .cluster { bottom: calc(8px + env(safe-area-inset-bottom)); }
    body.fullscreen.touch .cluster.mid { bottom: calc(8px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="0"></canvas></div>
<div id="touch" class="controls" aria-hidden="true">
  <div class="cluster left">
    <div class="shoulders"><div class="ctl shoulder" data-btn="256">L2</div><div class="ctl shoulder" data-btn="1024">L1</div></div>
    <div class="dpad" data-dpad>
      <span class="up" data-dir="16">▲</span><span class="left" data-dir="128">◀</span><span class="hub"></span>
      <span class="right" data-dir="32">▶</span><span class="down" data-dir="64">▼</span>
    </div>
    <div class="stick" data-stick><div class="knob" id="knob"></div></div>
  </div>
  <div class="cluster mid">
    <div class="ctl small" data-btn="1">Select</div>
    <div class="ctl small" data-btn="8">Start</div>
  </div>
  <div class="cluster right">
    <div class="shoulders"><div class="ctl shoulder" data-btn="2048">R1</div><div class="ctl shoulder" data-btn="512">R2</div></div>
    <div class="face">
      <div class="ctl tri" data-btn="4096">△</div>
      <div class="ctl sq" data-btn="32768">□</div>
      <div class="ctl ci" data-btn="8192">○</div>
      <div class="ctl cr" data-btn="16384">✕</div>
    </div>
  </div>
</div>
<div id="bar"><span id="status">Loading…</span><span id="stats"></span>
  <select id="scale" aria-label="Resolution" title="Internal resolution, the page reloads to apply it">
    <option value="1">640×512</option>
    <option value="2">1280×1024</option>
    <option value="3">1920×1536</option>
  </select>
  <button id="controls-toggle" type="button" hidden>Hide controls</button>
  <button id="export-card" type="button" title="Download the memory card in slot 1 as a .ps2 file">Export card</button>
  <button id="import-card" type="button" title="Put a .ps2 memory card file in slot 1">Import card</button>
  <input id="import-file" type="file" accept=".ps2" hidden>
  <button id="eject" type="button" title="Forget the cached disc; the page asks for the ISO again next time">Eject disc</button>
  <button id="fullscreen" type="button" title="Fullscreen (F or double click)">Fullscreen</button></div>
<button id="exit-fullscreen" type="button">Exit fullscreen</button>
<div id="overlay"><div id="panel">
  <h1 style="margin:0;font-size:20px">Burnout 3: Takedown</h1>
  <p id="help" hidden></p>
  <p id="disc-text">Checking for a cached disc…</p>
  <button id="pick" type="button" hidden>Choose your Burnout 3 ISO</button>
  <input id="pick-file" type="file" accept=".iso" hidden>
  <progress id="copy" max="100" value="0" hidden style="width:320px"></progress>
  <button id="start" disabled>Loading…</button>
  <button id="eject-overlay" type="button" hidden>Eject disc</button>
</div></div>
<script src="pad.js"></script>
<script src="disc.js"></script>
<script src="page.js"></script>
<script>
const statusEl = document.getElementById('status');
const CARD_DIR = '/memcard', CARD_FILE = '/memcard/Mcd001.ps2', CARD_BYTES = 8650752;
let noteTimer = 0, noteRestore = '';
function note(text) {
  if (!noteTimer) noteRestore = statusEl.textContent;
  clearTimeout(noteTimer);
  statusEl.textContent = text;
  noteTimer = setTimeout(() => {
    statusEl.textContent = noteRestore;
    noteTimer = 0;
  }, 5000);
}
const cardSaver = B3Page.cardSaver((done) => {
  try {
    FS.syncfs(false, (err) => {
      if (err) console.warn('memory card: could not write browser storage', err);
      done();
    });
  } catch (e) {
    done();
  }
});
function storeCard(then) { cardSaver.save(then); }
document.getElementById('export-card').addEventListener('click', () => {
  let data = null;
  try { data = FS.readFile(CARD_FILE); } catch (e) {}
  if (!data) {
    note('Nothing saved on the memory card yet');
    return;
  }
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([data], { type: 'application/octet-stream' }));
  link.download = 'Mcd001.ps2';
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 10000);
});
const importInput = document.getElementById('import-file');
document.getElementById('import-card').addEventListener('click', () => importInput.click());
importInput.addEventListener('change', async () => {
  const file = importInput.files[0];
  importInput.value = '';
  if (!file) return;
  if (file.size !== CARD_BYTES) {
    note('That is not an 8 MB PS2 memory card image (' + CARD_BYTES + ' bytes)');
    return;
  }
  const data = new Uint8Array(await file.arrayBuffer());
  if (new TextDecoder().decode(data.subarray(0, 28)) !== 'Sony PS2 Memory Card Format ') {
    note('That file is not a formatted PS2 memory card');
    return;
  }
  if (!confirm('Replace the memory card in slot 1 with ' + file.name + '? The page reloads to use it.')) return;
  try {
    FS.writeFile(CARD_FILE, data);
  } catch (e) {
    note('Import failed: ' + e.message);
    return;
  }
  storeCard(() => location.reload());
});
const statsEl = document.getElementById('stats');
const canvas = document.getElementById('canvas');
const params = new URLSearchParams(location.search);

function missingFeatures() {
  const header = [0, 97, 115, 109, 1, 0, 0, 0, 1, 4, 1, 96, 0, 0, 3, 2, 1, 0, 10];
  const accepts = (body) => {
    try {
      return WebAssembly.validate(new Uint8Array(header.concat([body.length + 2, 1, body.length], body)));
    } catch (e) {
      return false;
    }
  };
  const missing = [];
  if (!window.crossOriginIsolated) missing.push('cross-origin isolation (COOP and COEP headers)');
  if (typeof WebAssembly.Suspending !== 'function') missing.push('WebAssembly JSPI');
  if (!accepts([0, 0x1F, 0x40, 0, 0x0B, 0x0B])) missing.push('WebAssembly exception handling (try_table)');
  if (!accepts([0, 0x12, 0, 0x0B])) missing.push('WebAssembly tail calls');
  if (!accepts([0, 0xFD, 0x0C].concat(new Array(16).fill(0), [0x1A, 0x0B]))) missing.push('WebAssembly SIMD');
  return missing;
}
const missing = missingFeatures();

const touchRoot = document.getElementById('touch'), knob = document.getElementById('knob');
let touchPad = { buttons: 0, x: 0, y: 0, stick: false };
const fingers = new Map();
if (matchMedia('(pointer: coarse)').matches || params.has('touch')) document.body.classList.add('touch');
function circleOf(el) {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: r.width / 2 };
}
function onTouch(e) {
  e.preventDefault();
  const seen = new Set();
  let buttons = 0, sx = 0, sy = 0, stick = false;
  for (const t of e.touches) {
    seen.add(t.identifier);
    let f = fingers.get(t.identifier);
    if (!f) {
      const start = document.elementFromPoint(t.clientX, t.clientY);
      const region = start && start.closest('[data-stick],[data-dpad]');
      f = region ? { kind: region.hasAttribute('data-stick') ? 'stick' : 'dpad', el: region } : { kind: 'button' };
      fingers.set(t.identifier, f);
    }
    if (f.kind === 'stick') {
      const c = circleOf(f.el);
      let dx = (t.clientX - c.x) / c.r, dy = (t.clientY - c.y) / c.r;
      const len = Math.hypot(dx, dy);
      if (len > 1) { dx /= len; dy /= len; }
      sx = dx; sy = dy; stick = true;
      knob.style.transform = 'translate(' + (dx * c.r * 0.6) + 'px,' + (dy * c.r * 0.6) + 'px)';
    } else if (f.kind === 'dpad') {
      const d = circleOf(f.el), ox = t.clientX - d.x, oy = t.clientY - d.y;
      if (Math.hypot(ox, oy) > d.r * 0.2) {
        const angle = Math.atan2(oy, ox) * 180 / Math.PI;
        if (angle > -67.5 && angle < 67.5) buttons |= 0x20;
        if (angle > 22.5 && angle < 157.5) buttons |= 0x40;
        if (angle > 112.5 || angle < -112.5) buttons |= 0x80;
        if (angle > -157.5 && angle < -22.5) buttons |= 0x10;
      }
    } else {
      const over = document.elementFromPoint(t.clientX, t.clientY);
      const button = over && over.closest('[data-btn]');
      if (button && touchRoot.contains(button)) buttons |= Number(button.dataset.btn);
    }
  }
  for (const id of [...fingers.keys()]) if (!seen.has(id)) fingers.delete(id);
  if (!stick) knob.style.transform = '';
  touchPad = { buttons, x: sx, y: sy, stick };
  touchRoot.querySelectorAll('[data-btn]').forEach((el) => el.classList.toggle('on', (buttons & Number(el.dataset.btn)) !== 0));
  touchRoot.querySelectorAll('[data-dir]').forEach((el) => el.classList.toggle('on', (buttons & Number(el.dataset.dir)) !== 0));
  pollInput();
}
for (const type of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) touchRoot.addEventListener(type, onTouch, { passive: false });

const scaleSelect = document.getElementById('scale');
let scale = params.get('PS2_SCALE');
if (!scale) {
  try { scale = localStorage.getItem('ps2web-scale'); } catch (e) {}
}
scale = ['1', '2', '3'].includes(scale) ? scale : '1';
scaleSelect.value = scale;
scaleSelect.addEventListener('change', () => {
  try { localStorage.setItem('ps2web-scale', scaleSelect.value); } catch (e) {}
  const url = new URL(location.href);
  url.searchParams.delete('PS2_SCALE');
  location.href = url.href;
});

const controlsButton = document.getElementById('controls-toggle');
let hideControls = false;
try { hideControls = localStorage.getItem('ps2web-hide-controls') === '1'; } catch (e) {}
function updateControls() {
  const touch = document.body.classList.contains('touch');
  document.body.classList.toggle('hide-controls', hideControls);
  controlsButton.hidden = !touch;
  controlsButton.textContent = hideControls ? 'Show controls' : 'Hide controls';
  fitCanvas();
}
controlsButton.addEventListener('click', () => {
  hideControls = !hideControls;
  try { localStorage.setItem('ps2web-hide-controls', hideControls ? '1' : '0'); } catch (e) {}
  updateControls();
});

function fitCanvas() {
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  const width = Math.max(1, Math.round(canvas.clientWidth * ratio));
  const height = Math.max(1, Math.round(canvas.clientHeight * ratio));
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
    if (Module.running && Module._ps2web_resize) Module._ps2web_resize(width, height);
  }
}
window.addEventListener('resize', fitCanvas);

const fullscreenButton = document.getElementById('fullscreen');
const root = document.documentElement;
const requestFullscreen = root.requestFullscreen || root.webkitRequestFullscreen;
const exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
const nativeFullscreen = () => document.fullscreenElement || document.webkitFullscreenElement;
let fullscreen = false;
function setFullscreen(on) {
  fullscreen = on;
  document.body.classList.toggle('fullscreen', on);
  fullscreenButton.textContent = on ? 'Exit fullscreen' : 'Fullscreen';
  fitCanvas();
}
function toggleFullscreen() {
  if (fullscreen) {
    if (nativeFullscreen() && exitFullscreen) exitFullscreen.call(document);
    setFullscreen(false);
    return;
  }
  setFullscreen(true);
  if (!requestFullscreen) return;
  const result = requestFullscreen.call(root, { navigationUI: 'hide' });
  if (result && result.then) {
    result.then(() => {
      if (document.body.classList.contains('touch') && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
    }).catch(() => {});
  }
}
function onFullscreenChange() {
  if (!nativeFullscreen() && fullscreen && requestFullscreen) setFullscreen(false);
  else fitCanvas();
}
document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);
fullscreenButton.addEventListener('click', toggleFullscreen);
document.getElementById('exit-fullscreen').addEventListener('click', toggleFullscreen);
canvas.addEventListener('dblclick', toggleFullscreen);
window.addEventListener('keydown', (e) => {
  if (e.code !== 'KeyF' || e.repeat || e.target.tagName === 'SELECT') return;
  e.preventDefault();
  toggleFullscreen();
});

const workletSource = `
class Output extends AudioWorkletProcessor {
  constructor(options) {
    super();
    const { buffer, base } = options.processorOptions;
    this.ring = new Uint32Array(buffer, base, 4);
    this.capacity = this.ring[2];
    this.samples = new Int16Array(buffer, base + 16, this.capacity * 2);
    this.left = 0;
    this.right = 0;
  }
  process(inputs, outputs) {
    const left = outputs[0][0], right = outputs[0][1];
    const write = Atomics.load(this.ring, 0), mask = this.capacity - 1;
    let read = Atomics.load(this.ring, 1);
    for (let i = 0; i < left.length; ++i) {
      if (read !== write) {
        const at = (read & mask) * 2;
        this.left = this.samples[at] / 32768;
        this.right = this.samples[at + 1] / 32768;
        read = (read + 1) >>> 0;
      } else {
        this.left *= 0.995;
        this.right *= 0.995;
      }
      left[i] = this.left;
      right[i] = this.right;
    }
    Atomics.store(this.ring, 1, read);
    Atomics.store(this.ring, 3, 1);
    return true;
  }
}
registerProcessor('ps2-output', Output);`;

let audio = null, node = null;
async function startAudio() {
  audio = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
  await audio.audioWorklet.addModule(URL.createObjectURL(new Blob([workletSource], { type: 'application/javascript' })));
  node = new AudioWorkletNode(audio, 'ps2-output', {
    outputChannelCount: [2],
    processorOptions: { buffer: Module.HEAPU8.buffer, base: Module._ps2web_audio_ring() },
  });
  node.connect(audio.destination);
}

// The game is told of the pad when a key or a touch changes, on every display refresh and with every frame.
const input = B3Pad.createInput((buttons, lx, ly, rx, ry) => Module._ps2web_pad(buttons, lx, ly, rx, ry));
function pollInput() {
  if (Module.running) input.poll(touchPad, navigator.getGamepads ? navigator.getGamepads() : []);
}
window.addEventListener('keydown', (e) => { if (input.keyDown(e.code)) { e.preventDefault(); pollInput(); } });
window.addEventListener('keyup', (e) => { input.keyUp(e.code); pollInput(); });
// A key held while the window loses focus would stay pressed in the game: its keyup goes elsewhere.
function releaseKeys() {
  input.releaseKeys();
  pollInput();
}
window.addEventListener('blur', releaseKeys);
// A hidden or closed page may never run its timers again: store a memory card save that is still waiting.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'hidden') return;
  releaseKeys();
  cardSaver.flush();
});
window.addEventListener('pagehide', () => cardSaver.flush());

// some browsers cannot show a canvas drawn by another GPU (hybrid laptops on Linux), so each adapter draws a few test frames first
async function canPresent(power) {
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: power });
  if (!adapter) return null;
  const device = await adapter.requestDevice();
  let failed = false;
  device.lost.then((info) => {
    if (info.reason === 'destroyed') return;
    failed = true;
    console.warn('[gpu check] ' + power + ' device lost: ' + info.message);
  });
  device.onuncapturederror = (e) => {
    failed = true;
    console.warn('[gpu check] ' + power + ': ' + e.error.message);
  };
  const probe = document.createElement('canvas');
  probe.width = probe.height = 64;
  probe.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;pointer-events:none';
  document.body.appendChild(probe);
  try {
    const context = probe.getContext('webgpu');
    context.configure({ device, format: navigator.gpu.getPreferredCanvasFormat(), alphaMode: 'opaque' });
    for (let i = 0; i < 3 && !failed; ++i) {
      const encoder = device.createCommandEncoder();
      encoder.beginRenderPass({ colorAttachments: [{ view: context.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] }).end();
      device.queue.submit([encoder.finish()]);
      await new Promise((resolve) => requestAnimationFrame(resolve));
      await device.queue.onSubmittedWorkDone();
    }
  } catch (e) {
    failed = true;
    console.warn('[gpu check] ' + power + ': ' + e);
  }
  probe.remove();
  const name = [adapter.info.vendor, adapter.info.architecture].filter(Boolean).join(' ') || power;
  device.destroy();
  return failed ? null : name;
}

function webgpuHelp(onCpu) {
  const firefox = navigator.userAgent.includes('Firefox/');
  const linux = navigator.userAgent.includes('Linux') && !navigator.userAgent.includes('Android');
  if (firefox) return 'WebGPU is turned off in this Firefox, so the game runs on the slow software renderer. Set dom.webgpu.enabled to true in about:config and reload.';
  if (linux && onCpu) return 'WebGPU runs on the CPU here, so the game is slow. Turn on chrome://flags/#enable-vulkan as well, then restart the browser.';
  if (linux) return 'WebGPU is turned off in this browser, so the game runs on the slow software renderer. Turn on chrome://flags/#enable-unsafe-webgpu and chrome://flags/#enable-vulkan, then restart the browser.';
  return 'This browser has no WebGPU, so the game runs on the slow software renderer. A current Chrome, Edge or Safari is much faster.';
}

async function chooseGpu() {
  if (!navigator.gpu) {
    Module.gpuHelp = webgpuHelp(false);
    return 'WebGPU unavailable, software renderer';
  }
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) {
    Module.gpuHelp = webgpuHelp(false);
    return 'WebGPU has no adapter, software renderer';
  }
  if (adapter.info.isFallbackAdapter || adapter.info.architecture === 'swiftshader') Module.gpuHelp = webgpuHelp(true);
  if (navigator.userAgent.includes('Firefox/')) {
    Module.presentCopy = true;
    return 'Firefox, frames copied to the page';
  }
  const forced = params.get('gpu');
  if (forced !== 'low') {
    const name = await canPresent('high-performance');
    if (name) return 'GPU ' + name;
  }
  const name = await canPresent('low-power');
  if (name) {
    Module.ENV.PS2_GPU_LOW_POWER = '1';
    return 'GPU ' + name;
  }
  Module.presentCopy = true;
  return 'GPU cannot draw to the page, copying frames';
}

let frames = 0, last = performance.now(), lastGpu = 0, lastEmuIdle = 0, lastEmuHeld = 0, lastRenderIdle = 0, lastVuIdle = 0, lastInterpreted = 0;
let shown = 0, fresh = false;
const countShown = () => {
  if (fresh) ++shown;
  fresh = false;
  pollInput();
  requestAnimationFrame(countShown);
};
requestAnimationFrame(countShown);
const discText = document.getElementById('disc-text');
const pickButton = document.getElementById('pick');
const pickInput = document.getElementById('pick-file');
const copyBar = document.getElementById('copy');
const ejectOverlay = document.getElementById('eject-overlay');
const ejectBar = document.getElementById('eject');
const EJECT_PENDING = 'b3-eject-pending';
let resolveDisc;
const discReady = new Promise((resolve) => { resolveDisc = resolve; });
let runtimeReady = false, discGone = false, discIsCached = false;

// Start is usable once the runtime is up and there is a disc to read.
function refreshStart() {
  const start = document.getElementById('start');
  if (start && runtimeReady && !missing.length) start.disabled = discGone;
}
// The first disc resolves discReady; a disc picked after an eject replaces it.
// fromCache says whether the runtime reads the browser's cached copy or a picked file.
function useDisc(file, fromCache) {
  discIsCached = fromCache;
  resolveDisc(file);
  if (Module.discFile) {
    Module.discFile = file;
    Module.discSize = file.size;
  }
  discGone = false;
  refreshStart();
}
// Disc messages go to the first-run panel while it is up, to the status bar after Start.
function discStatus(text) {
  const el = document.getElementById('disc-text');
  if (el) el.textContent = text;
  else note(text);
}
// The cached file must not be removed while it is being written.
function setCopying(on) {
  ejectBar.disabled = ejectOverlay.disabled = on;
}

async function findDisc() {
  ejectOverlay.hidden = true;
  // An eject asked for while the game was reading the cached copy happens now.
  let pending = false;
  try { pending = localStorage.getItem(EJECT_PENDING) === '1'; } catch (e) {}
  if (pending) {
    try {
      await B3Disc.ejectDisc();
      localStorage.removeItem(EJECT_PENDING);
    } catch (e) {
      console.warn('pending disc eject failed', e);
    }
  }
  let cached = null;
  try { cached = await B3Disc.cachedDisc(); } catch (e) { console.warn('disc cache unavailable', e); }
  if (cached) {
    discText.textContent = 'Disc ready (' + (cached.size / 1073741824).toFixed(2) + ' GB cached in this browser).';
    ejectOverlay.hidden = false;
    useDisc(cached, true);
    return;
  }
  discText.textContent = 'First time here: point the browser at your Burnout 3: Takedown (NTSC-U) ISO. It is copied into this browser once and never uploaded.';
  pickButton.disabled = false;
  pickButton.hidden = false;
}
pickButton.addEventListener('click', () => pickInput.click());
pickInput.addEventListener('change', async () => {
  const file = pickInput.files[0];
  pickInput.value = '';
  if (!file) return;
  pickButton.disabled = true;
  let id;
  try { id = await B3Disc.identify(file); } catch (e) { discText.textContent = file.name + ': ' + e.message; pickButton.disabled = false; return; }
  if (!id.ok) {
    discText.textContent = file.name + ' boots ' + (id.boot || 'nothing recognisable') + '. This page needs the NTSC-U Burnout 3 disc (SLUS_210.50).';
    pickButton.disabled = false;
    return;
  }
  pickButton.hidden = true;
  discText.textContent = 'Disc accepted. You can start now; it is being copied into this browser for next time.';
  useDisc(file, false);                                // play from the picked file right away
  copyBar.value = 0;
  copyBar.hidden = false;
  setCopying(true);
  try {
    await B3Disc.cacheDisc(file, (done, total) => { copyBar.value = Math.round(done * 100 / total); });
    copyBar.hidden = true;
    ejectOverlay.hidden = false;
    discStatus('Disc cached. Next time this page starts straight away.');
  } catch (e) {
    copyBar.hidden = true;
    discStatus((e.name === 'QuotaError' ? e.message : 'Could not cache the disc: ' + e.message) + '. You can still play this visit.');
  } finally {
    setCopying(false);
  }
});
async function ejectDisc() {
  // The running game reads the cached copy: removing it now would break the next disc read.
  if (Module.running && discIsCached) {
    if (!confirm('Eject the cached disc after this session? The page will ask for your ISO on the next load.')) return;
    try {
      localStorage.setItem(EJECT_PENDING, '1');
      note('Disc will be ejected the next time this page loads');
    } catch (e) {
      note('Could not schedule the eject: ' + e.message);
    }
    return;
  }
  if (!confirm('Forget the cached disc? The page will ask for your ISO again next time.')) return;
  try { await B3Disc.ejectDisc(); } catch (e) { discStatus('Eject failed: ' + e.message); return; }
  if (!document.getElementById('overlay')) {
    note('Disc ejected');
  } else if (discIsCached) {
    // Still on the first-run panel: nothing to boot from until another ISO is picked.
    discIsCached = false;
    discGone = true;
    refreshStart();
    findDisc();
  } else {
    // The picked file is still in hand, so this visit can go on without the cached copy.
    ejectOverlay.hidden = true;
    discStatus('Cached copy removed. You can still play this visit from the file you picked.');
  }
}
ejectBar.addEventListener('click', ejectDisc);
ejectOverlay.addEventListener('click', ejectDisc);
findDisc();
var Module = {
  canvas,
  arguments: ['/game/core.elf'].concat(params.has('arg') ? ['--arg', params.get('arg')] : [], params.getAll('press').flatMap((p) => p.split(',').flatMap((x) => ['--press', x]))),
  discUrl: params.get('disc') || 'disc.iso',
  stateUrl: params.get('state'),
  noSurface: params.has('nosurface'),
  noCard: params.has('nocard'),
  presentCopy: params.has('copy'),
  // ?pace=old: wait for the display and for the audio device as the page did before the fork's host/pace.cpp, to compare the two.
  paceOld: params.get('pace') === 'old',
  // The runtime cannot start the game (the disc's executable is not the one the page was built from).
  ps2Fatal: (text) => { statusEl.textContent = text; },
  print: (text) => console.log(text),
  printErr: (text) => console.log(text),
  setStatus: (text) => {
    if (!text || Module.gpuInfo) return;
    const progress = text.match(/^Downloading data\.\.\. \((\d+)\/\d+\)/);
    statusEl.textContent = progress ? 'Downloading game data, ' + (Number(progress[1]) / 1048576).toFixed(1) + ' MB unpacked' : text;
  },
  onRuntimeInitialized: () => {
    const start = document.getElementById('start');
    if (missing.length) return;
    runtimeReady = true;
    start.textContent = 'Start';
    refreshStart();
  },
  preRun: [() => {
    if (!Module.noCard) {
      try {
        FS.mkdir(CARD_DIR);

        FS.syncfs(true, (err) => {
          if (err) console.warn('memory card: could not read browser storage', err);

    Module.ENV.PS2_SCALE = scale;
    Module.addRunDependency('disc');
    Promise.all([discReady, chooseGpu().catch((e) => 'GPU check failed: ' + e)]).then(([file, gpu]) => {
      Module.discFile = file;
      Module.discSize = file.size;
      Module.gpuInfo = gpu;
      if (Module.gpuHelp && !missing.length) {
        const help = document.getElementById('help');

        help.hidden = false;
      }
      statusEl.textContent = 'Disc ' + (file.size / 1073741824).toFixed(2) + ' GB, ' + gpu;
      Module.removeRunDependency('disc');
    });
  }],
  audioQueuedMs: () => Module._ps2web_audio_queued_ms(),
  ps2CardSaved: () => storeCard(),
  onFrame: () => {
    pollInput();
    ++frames;
    fresh = true;
    const now = performance.now();
    if (now - last >= 1000) {
      const gpu = Module._ps2web_gpu_ms();
      const memory = (Module.HEAPU8.length / 1048576).toFixed(0);
      const emuIdle = Module._ps2web_idle_ms(0), renderIdle = Module._ps2web_idle_ms(1), vuIdle = Module._ps2web_idle_ms(2), span = now - last;
      // A runtime older than ps2web_stack_used does not count the held time (it answers 3 with the main thread's figure).

      const interpreted = Module._ps2web_vu_interpreted();

        frame: Module._ps2web_frames(), fps: frames * 1000 / span, shown: shown * 1000 / span, gpu: share(gpu - lastGpu),
        emuIdle: share(emuIdle - lastEmuIdle), vuIdle: share(vuIdle - lastVuIdle), gsIdle: share(renderIdle - lastRenderIdle),
        emuHeld: share(emuHeld === undefined ? undefined : emuHeld - lastEmuHeld), heapMb: memory, audioMs: Module.audioQueuedMs(),
        interpreted: (interpreted - lastInterpreted) * 1000 / span,
      });
      lastInterpreted = interpreted;
      lastEmuIdle = emuIdle;
      lastEmuHeld = emuHeld;
      lastRenderIdle = renderIdle;
      lastVuIdle = vuIdle;
      lastGpu = gpu;
      frames = 0;
      shown = 0;
      last = now;
    }
  },
  noInitialRun: true,
};

updateControls();
if (missing.length) {
  const help = document.getElementById('help');
  help.textContent = 'This browser cannot run the game yet. It lacks ' + missing.join(', ') + '. A current Chrome or Edge has everything it needs.';
  help.hidden = false;
  document.getElementById('start').textContent = 'Unsupported browser';
}

document.getElementById('start').addEventListener('click', async () => {
  document.getElementById('overlay').remove();
  canvas.focus();
  fitCanvas();
  await startAudio();
  statusEl.textContent = 'Running, ' + Module.gpuInfo;
  Module.running = true;
  Module.callMain(Module.arguments);
});
